[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line interface for the Pangram API"

[[bin]]
name = "pangram"
path = "src/main.rs"

[features]
default = ["annotate"]
# The `pangram annotate` subcommand (PDF text extraction and annotation).
annotate = ["dep:annotate"]

[dependencies]
annotate = { workspace = true, optional = true }
anyhow.workspace = true
clap.workspace = true
pangram-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
